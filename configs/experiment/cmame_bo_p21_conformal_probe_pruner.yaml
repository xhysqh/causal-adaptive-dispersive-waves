scope: >-
  Frozen P1.1 deterministic conservation envelope with a trajectory-group
  conformal selective probe pruner. The learned component may only cancel an
  already scheduled regular N--2N probe. It cannot add probes, modify an error
  estimate, rank N/dt actions, advance the PDE or update the state. Hard
  spectral triggers and OOD inputs follow P1.1 exactly; shadow truth is audit-only.
