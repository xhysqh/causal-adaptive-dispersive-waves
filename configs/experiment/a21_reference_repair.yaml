seed: 20260803
phase05_acceptance: results/reference_cross_validation/acceptance.json
source_a21_acceptance: results/a21_cross_scale_identifiability/acceptance.json
output_dir: results/a21_reference_repair
domain: {x_min: -10.0, length: 20.0}
orders: {temporal_p: 2.0, spatial_q: 2.0}
reference:
  master_points: 512
  shadow_points: 1024
  output_dt: 0.001
  method: DOP853
  rtol: 1.0e-10
  atol: 1.0e-12
  dealias: true
  filter: false
paired_design:
  coarse_points: [64, 128]
  time_steps: [0.004, 0.002, 0.001]
  equation: {k1: 0.0, k2: 1.0, k: 1}
  scenarios:
    gaussian:
      final_time: 0.16
      initial: {kind: gaussian, amplitude: 0.5, center: -1.0, width: 1.2}
    single_peakon:
      final_time: 0.3
      initial: {kind: single_peakon, amplitude: 0.8, center: -1.0, width: 1.0}
    double_peakon:
      final_time: 3.0
      initial:
        kind: multi_peakon
        amplitudes: [1.2, 0.5]
        centers: [-1.0, 1.0]
        width: 1.0
common_resolved_space:
  base_points: 64
  cutoff_rule: two_thirds
  mode_cutoff: 21
comparison:
  points: 64
  time_tolerance: 1.0e-11
acceptance:
  maximum_reference_increment_contamination: 0.30
  maximum_median_tail_fraction: 0.50
  maximum_gaussian_closure_error: 0.10
  maximum_nonsmooth_closure_error: 0.30
  minimum_component_cosine: 0.80
  maximum_scaled_design_condition: 100.0
  minimum_richardson_improved_scenarios: 2
  maximum_median_richardson_defect_ratio: 1.0
  require_finite: true
