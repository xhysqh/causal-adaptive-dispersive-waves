phase: CMAME-V2-stage-4-safety-shielded-controller
source_manifest: results/cmame_v2_predictive_risk/full/frozen_v2_predictive_risk_manifest.json

controller:
  reserve_fraction: 0.10
  hold_risk_threshold: 0.65
  corrective_risk_threshold: 1.00
  coarse_risk_threshold: 0.15
  cooldown_prefixes: 4
  stable_prefixes_for_coarsening: 5
  uncertainty_probe_threshold: 0.75
  fallback_hold_local_budget_fraction: 0.50
  coarse_tail_limit: 0.02
  coarse_localized_sharpness_limit: 0.95
  # 95% quantiles of velocity/acceleration norms among train-split hold rows
  # with R^(2) <= 0.15 are 5.51 and 6.35, respectively.
  coarse_history_velocity_limit: 6.0
  coarse_history_acceleration_limit: 7.0

scope: >-
  Stage 4 only connects the frozen H=2 risk envelope to candidate selection.
  Deterministic error, invariant, and projection admissibility are evaluated
  before learned ranking. The learned action set is shrink_time, hold, and
  refine_space. Coarsen_space has no learned authority because it was absent
  from stage-2 labels; it requires an independent verification, a passed
  projection/invariant check, cooldown expiry, and stable-hold hysteresis.
