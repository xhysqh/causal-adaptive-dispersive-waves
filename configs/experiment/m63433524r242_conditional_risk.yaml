phase: M6.3.4.3.3.5.2.4-R2.4.2_conditional_moe_risk_head
output_dir: results/m63433524r242_conditional_local_risk
dataset_file: r242_conditional_dataset.npz
dataset_acceptance_file: dataset_acceptance.json
next_phase: fixed_selection_and_ltt
scope: >-
  Fresh development-only K-step target-cell conditional dataset and MoE
  identifiability audit. R2.3 and R2.4.1-A remain immutable; no deployment
  gate or LTT certificate is frozen in this phase.

# Frozen R2.3 prerequisite (same as R2.4.1)
source_r23_output: results/m63433524r23_counterfactual_contrast_repair
source_scale_budget: results/m63433521_paired_scale_shadow/scale_error_budget.json
source_m6333_acceptance: results/m6333_safe_learned_rollout/acceptance.json
source_m6332_checkpoints: results/m6332_local_amr_operator
source_m6341_checkpoints: results/m63431_deployment_risk_recalibration
source_r23_training_seeds: [211, 239, 271]
seeds: [11, 29, 47]
source_r241_output: results/m63433524r241_local_counterfactual_repair
source_r241_dataset_file: target_counterfactual_local_risk_samples.npz
source_r241a_acceptance: results/_analysis/m63433524r241a_readonly_fusion_audit/acceptance.json

# Fresh seeds — must NOT overlap with R2.4.1 seeds [11, 29, 47]
# Using a different seed base to guarantee no collision
dataset:
  seed: 2456343524
  length: 6.283185307179586
  family: separated
  points: 32
  dt: 0.00005
  maximum_horizon: 4
  labelled_starts_per_trajectory: 8
  groups_per_split: {train: 240, calibration: 120, selection: 240}
  behaviour_policies: [candidate, fallback, alternating, burst]
  burst_width: 2
  burst_period: 5
  geometry_bins: [balanced, skewed]
  amplitude_ratio_threshold: 1.25
  maximum_geometry_seed_attempts: 80

proposal_model: {feature_channels: 11, parameter_channels: 6, hidden: 24}
risk_model: {context_channels: 48, residual_channels: 7, context_hidden: 32, residual_hidden: 16, context_correction_bound: 1.0}
refinement: {theta: 0.6, maximum_fraction: 0.4, halo_cells: 1, maximum_cfl: 0.45}
controller:
  selected_weight: 0.0625
  minimum_dt: 0.00005
  maximum_dt: 0.0004
  maximum_relative_energy_drift: 0.02
  maximum_mass_drift: 1.0e-10
  maximum_patch_migration_relative_h1: 0.02
  maximum_patch_migration_to_step_increment: 0.1
  proposal_reference_dt: 0.0002
label:
  minimum_direction_cosine: -0.05
  maximum_mass_drift: 1.0e-10
  maximum_relative_energy_drift: 0.02
  maximum_cfl: 0.45
  maximum_patch_migration_to_step_increment: 0.1
  exit_threshold: 1.0
  severe_threshold: 2.0

# Three-member ensemble — seeds must differ from both data seeds and R2.4.1 seeds
local_head:
  seeds: [200, 201, 202]
  hidden_channels: 64
  epochs: 320
  learning_rate: 3.0e-4
  upper_std_multiplier: 1.0
  residual_bound: 2.0
  gate_loss_weight: 0.1
  minimum_gate_separation: 0.05
  minimum_selection_auc: 0.85
  minimum_worst_geometry_auc: 0.80
  minimum_calibration_groups: 40
  minimum_selection_groups: 104
  minimum_selection_groups_per_geometry: 20
