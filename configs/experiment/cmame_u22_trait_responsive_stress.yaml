phase: CMAME-U2.2-trait-responsive-stress
output_dir: results/cmame_u22_trait_responsive_stress
mechanism_output_dir: results/cmame_u1_universal_mechanism
power_prerequisite: results/cmame_u201_unknown_wave_evidence_repair/full/acceptance.json
ilw_prerequisite: results/cmame_u211_ilw_evidence_repair/full/acceptance.json
next_phase_on_pass: CMAME-U3_multiequation_paper_benchmark

domain: {length: 20.0, x_min: -10.0}
families: [single_soliton, two_soliton_collision, cnoidal_periodic, smooth_to_oscillatory]
seeds: {development_base: 151000000, calibration_base: 153000000, external_base: 157000000}

development:
  power_orders: [2.4, 3.2]
  ilw_depths: [0.25, 1.0, 5.0]
  groups_per_family: 1
  amplitude_scales: [1.0, 1.6]
  decisions: 8
  macro_dt: 0.004
  points: 32
  minimum_points: 32
  maximum_points: 64
  probe_maximum_points: 128
  reference_points: 64
  tolerances: [0.05, 0.001]
  maximum_invariant_drift: 0.03

calibration:
  power_orders: [2.2, 2.6, 3.2]
  ilw_depths: [0.25, 1.0, 5.0]
  groups_per_family: 1
  amplitude_scales: [1.0, 1.4, 1.8]
  decisions: 32
  macro_dt: 0.012
  points: 32
  minimum_points: 32
  maximum_points: 128
  probe_maximum_points: 256
  reference_points: 256
  tolerances: [0.003, 0.0001]
  maximum_invariant_drift: 0.002

full:
  power_orders: [2.2, 2.4, 2.6, 2.8, 3.2]
  ilw_depths: [0.1, 0.25, 0.5, 1.0, 2.0, 5.0, 20.0]
  groups_per_family: 2
  amplitude_scales: [1.0, 1.75]
  decisions: 48
  macro_dt: 0.015
  points: 32
  minimum_points: 32
  maximum_points: 256
  probe_maximum_points: 512
  reference_points: 512
  tolerances: [0.003, 0.0001]
  maximum_invariant_drift: 0.001

power_traits:
  nonlinear_intercept: 1.0
  nonlinear_slope: 2.0
  tail_fraction: 0.65
  maximum_nonlinear_phase: 2.5
ilw_traits:
  nonlinear_transport: 1.0
  tail_fraction: 0.65
  maximum_nonlinear_phase: 2.5
estimator: {richardson_safety: 1.25, spatial_safety: 0.05, representation_safety: 0.02}

certification:
  warmup_probes: 3
  rolling_window: 8
  release_horizon: 6
  verification_interval: 5
  probe_safety: 1.50
  maximum_log_jump: 1.50
  reserve_fraction: 0.10

# Frozen before the new external seed range is opened.  Power-law has four
# symbol coordinates and ILW has five, followed by five state coordinates.
response:
  power_law:
    drift_scale: [0.15, 0.20, 0.50, 0.50, 0.75, 0.75, 0.75, 0.40, 0.25]
    soft_drift: 0.70
    hard_drift: 1.40
    lazy_hold_budget_fraction: 0.65
    tail_trigger: 0.025
    aliasing_trigger: 0.010
    stable_prefixes_for_coarsening: 4
    coarsening_budget_fraction: 0.15
    coarsening_tail_limit: 0.003
    coarsening_aliasing_limit: 0.001
  ilw:
    drift_scale: [0.15, 0.15, 0.15, 0.30, 0.25, 0.75, 0.75, 0.75, 0.40, 0.25]
    soft_drift: 0.70
    hard_drift: 1.40
    lazy_hold_budget_fraction: 0.65
    tail_trigger: 0.025
    aliasing_trigger: 0.010
    stable_prefixes_for_coarsening: 4
    coarsening_budget_fraction: 0.15
    coarsening_tail_limit: 0.003
    coarsening_aliasing_limit: 0.001

reference: {rtol: 1.0e-10, atol: 1.0e-12}
statistics: {bootstrap_samples: 4000, confidence: 0.95, seed: 20260901}

acceptance:
  minimum_overall_tolerance_coverage: 0.95
  minimum_family_tolerance_coverage: 0.90
  maximum_median_error_ratio_to_always_probe: 1.05
  maximum_invariant_drift: 0.001
  maximum_total_work_ratio_to_always_probe: 0.75
  minimum_lazy_candidate_reduction_fraction: 0.20
  minimum_probe_reduction_fraction: 0.50
  minimum_non_hold_fraction: 0.01
  minimum_forced_trait_probes: 1
  minimum_refinements: 1
  minimum_time_shrinks: 1
  minimum_coarsenings: 1

scope: >-
  Fresh, precommitted response stress test for a frozen mCH--BO property
  operator. Trait drift changes verification frequency but cannot relax the
  analytical envelope. Candidate evaluation is lazy and committed states are
  reused. Coarsening is projection-defect certified with hysteresis. Neither
  calibration nor external power-law/ILW states update network weights.
