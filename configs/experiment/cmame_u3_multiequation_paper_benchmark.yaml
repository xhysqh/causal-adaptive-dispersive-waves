phase: CMAME-U3-multiequation-paper-benchmark
output_dir: results/cmame_u3_multiequation_paper_benchmark
next_phase_on_pass: CMAME-PAPER_results_and_figures

# U3 never updates a model or a controller. Every row below was generated by
# an earlier fresh-seed prospective audit and is frozen by content hash.
development_sources:
  mch_bo:
    equations: [modified_camassa_holm, benjamin_ono]
    acceptance: results/cmame_f101_metric_repair/development/acceptance.json
    rows: results/cmame_f101_metric_repair/development/external_audit_rows.csv
    proposed_arm: frozen_causal
  kdv:
    equations: [kdv]
    acceptance: results/cmame_kdv_u11_self_certifying/development/acceptance.json
    rows: results/cmame_kdv_u11_self_certifying/development/audit_rows.csv
    proposed_arm: self_certifying
    always_probe_arm: always_probe
    analytical_arm: analytical_control
  transfer:
    equations: [power_law, ilw]
    acceptance: results/cmame_u22_trait_responsive_stress/full/acceptance.json
    rows: results/cmame_u22_trait_responsive_stress/full/audit_rows.csv
    proposed_arm: trait_responsive
    always_probe_arm: always_probe
    analytical_arm: analytical_control

full_sources:
  mch_bo:
    equations: [modified_camassa_holm, benjamin_ono]
    acceptance: results/cmame_f101_metric_repair/full/acceptance.json
    rows: results/cmame_f101_metric_repair/full/external_audit_rows.csv
    proposed_arm: frozen_causal
  kdv:
    equations: [kdv]
    acceptance: results/cmame_kdv_u11_self_certifying/full/acceptance.json
    rows: results/cmame_kdv_u11_self_certifying/full/audit_rows.csv
    proposed_arm: self_certifying
    always_probe_arm: always_probe
    analytical_arm: analytical_control
  transfer:
    equations: [power_law, ilw]
    acceptance: results/cmame_u22_trait_responsive_stress/full/acceptance.json
    rows: results/cmame_u22_trait_responsive_stress/full/audit_rows.csv
    proposed_arm: trait_responsive
    always_probe_arm: always_probe
    analytical_arm: analytical_control

expected_equations:
  [modified_camassa_holm, benjamin_ono, kdv, power_law, ilw]

invariant_limits:
  modified_camassa_holm: 1.0e-12
  benjamin_ono: 1.0e-5
  kdv: 1.0e-5
  power_law: 1.0e-4
  ilw: 1.0e-4

statistics: {bootstrap_samples: 5000, confidence: 0.95, seed: 20260901}

acceptance:
  minimum_equation_terminal_tolerance_coverage: 0.90
  minimum_family_terminal_tolerance_coverage: 0.90
  minimum_paired_tolerance_monotone_fraction: 0.90
  maximum_transfer_median_error_ratio_to_always_probe: 1.05
  maximum_transfer_work_ratio_to_always_probe: 0.60
  minimum_transfer_probe_reduction_fraction: 0.50
  minimum_equations: 5
  minimum_non_hold_actions: 1
  minimum_time_shrinks: 1
  minimum_space_refinements: 1

# Smoke-only thresholds for the tiny local development subsets. They never
# enter the U3 paper claim; full mode always uses the precommitted limits above.
development_acceptance:
  minimum_equation_terminal_tolerance_coverage: 0.70
  minimum_family_terminal_tolerance_coverage: 0.0
  minimum_paired_tolerance_monotone_fraction: 0.80
development_invariant_limits:
  benjamin_ono: 1.0e-4

scope: >-
  Hash-frozen synthesis of independent prospective closed-loop evidence for
  mCH, BO, KdV, unseen power-law dispersion and finite-depth ILW. U3 performs
  no training, threshold selection, PDE rollout or reference computation. It
  aligns already frozen posthoc audits, preserves equation-specific structure
  metrics, and tests one precommitted multi-equation paper claim.
