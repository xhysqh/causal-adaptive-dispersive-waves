seed: 20260720
phase05_acceptance: results/reference_cross_validation/acceptance.json
output_dir: results/a1_defect_learning
domain:
  x_min: -10.0
  length: 20.0
reference:
  fine_ratio: 4
  method: DOP853
  rtol: 1.0e-10
  atol: 1.0e-12
  dealias: true
  filter: false
label:
  kind: defect_rate
features:
  channels:
    - u_previous
    - u_current
    - momentum_current
    - d1_current
    - d2_current
    - baseline_next
    - baseline_momentum_next
    - baseline_residual
  parameters: [k1, k2, k, h, dt, length, points]
model:
  hidden_channels: 24
  blocks: 3
  kernel_size: 5
  normalization: group
training:
  seeds: [11, 22, 33]
  epochs: 40
  batch_size: 128
  learning_rate: 0.002
  weight_decay: 1.0e-6
  gradient_clip: 1.0
trajectories:
  - id: train_gaussian_left
    split: train
    coarse_points: 64
    dt: 0.002
    final_time: 0.16
    equation: {k1: 0.0, k2: 1.0, k: 1}
    initial: {kind: gaussian, amplitude: 0.45, center: -3.0, width: 1.1}
  - id: train_gaussian_center
    split: train
    coarse_points: 64
    dt: 0.002
    final_time: 0.16
    equation: {k1: 0.0, k2: 1.0, k: 1}
    initial: {kind: gaussian, amplitude: 0.55, center: 0.0, width: 1.3}
  - id: train_gaussian_right
    split: train
    coarse_points: 64
    dt: 0.002
    final_time: 0.16
    equation: {k1: 0.0, k2: 1.0, k: 1}
    initial: {kind: gaussian, amplitude: 0.65, center: 2.5, width: 1.5}
  - id: train_peakon_left
    split: train
    coarse_points: 64
    dt: 0.002
    final_time: 0.16
    equation: {k1: 0.0, k2: 1.0, k: 1}
    initial: {kind: single_peakon, amplitude: 0.7, center: -2.0, width: 1.0}
  - id: train_peakon_right
    split: train
    coarse_points: 64
    dt: 0.002
    final_time: 0.16
    equation: {k1: 0.0, k2: 1.0, k: 1}
    initial: {kind: single_peakon, amplitude: 0.9, center: 2.0, width: 1.0}
  - id: id_gaussian
    split: id_test
    coarse_points: 64
    dt: 0.002
    final_time: 0.16
    equation: {k1: 0.0, k2: 1.0, k: 1}
    initial: {kind: gaussian, amplitude: 0.5, center: 1.0, width: 1.2}
  - id: unseen_initial_width
    split: unseen_initial
    coarse_points: 64
    dt: 0.002
    final_time: 0.16
    equation: {k1: 0.0, k2: 1.0, k: 1}
    initial: {kind: gaussian, amplitude: 0.5, center: -1.0, width: 0.75}
  - id: unseen_parameter
    split: unseen_parameter
    coarse_points: 64
    dt: 0.002
    final_time: 0.16
    equation: {k1: 0.05, k2: 0.9, k: 1}
    initial: {kind: gaussian, amplitude: 0.5, center: -1.0, width: 1.2}
  - id: unseen_grid
    split: unseen_grid
    coarse_points: 128
    dt: 0.002
    final_time: 0.16
    equation: {k1: 0.0, k2: 1.0, k: 1}
    initial: {kind: gaussian, amplitude: 0.5, center: -1.0, width: 1.2}
  - id: unseen_dt
    split: unseen_dt
    coarse_points: 64
    dt: 0.004
    final_time: 0.16
    equation: {k1: 0.0, k2: 1.0, k: 1}
    initial: {kind: gaussian, amplitude: 0.5, center: -1.0, width: 1.2}
  - id: long_rollout
    split: long_rollout
    coarse_points: 64
    dt: 0.002
    final_time: 0.4
    equation: {k1: 0.0, k2: 1.0, k: 1}
    initial: {kind: single_peakon, amplitude: 0.8, center: -1.0, width: 1.0}
  - id: unseen_peak_count
    split: unseen_peak_count
    coarse_points: 64
    dt: 0.002
    final_time: 0.2
    equation: {k1: 0.0, k2: 1.0, k: 1}
    initial:
      kind: multi_peakon
      amplitudes: [0.8, 0.55]
      centers: [-2.0, 2.0]
      width: 1.0
acceptance:
  maximum_data_alignment_error: 1.0e-12
  require_id_one_step_gain: true
  minimum_ood_categories_improved: 4
  require_rollout_gain: true
  maximum_spurious_peak_increase: 1
  maximum_seed_ratio_std: 0.25
  correction_scale_min: 0.05
  correction_scale_max: 20.0
  require_finite: true
