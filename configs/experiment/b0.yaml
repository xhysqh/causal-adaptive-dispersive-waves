checkpoint_dir: results/a22_sequential_safe_rollout_r3/checkpoints
a22_rollout_metrics: results/a22_sequential_safe_rollout_r3/rollout_metrics.csv
output_dir: results/b0_geometry_ablation
domain: {x_min: -10.0, length: 20.0}
orders: {spatial: 2.0, temporal: 2.0}
causal_scale: {formula: dt_residual_negative_norm, epsilon: 1.0e-12}
folds:
  - {id: holdout_n128_dt004, points: 128, dt: 0.004}
  - {id: holdout_n64_dt001, points: 64, dt: 0.001}
  - {id: holdout_n128_dt002, points: 128, dt: 0.002}
training:
  seeds: [11, 22, 33]
model:
  hidden_channels: 24
  blocks: 3
  kernel_size: 5
  normalization: group
variants: [safe_euclidean, tangent_additive, radial_projection, exp_map, full_gsp]
evaluation:
  one_step_max_samples_per_trajectory: 256
trust:
