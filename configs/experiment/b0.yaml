  maximum_angle: 0.35
  backtracking: [1.0, 0.5, 0.25, 0.125]
  residual_factor: 1.05
  correction_rate_allowance: 1.05
  spectral_tail_fraction: 0.25
  spectral_tail_factor: 1.5
  maximum_new_peaks: 0
  peak_anchor: shadow_baseline
  fallback: resynchronize_shadow_baseline
  feature_ood_quantile: 0.999
  feature_ood_multiplier: 1.5
acceptance:
  maximum_tangent_relative_inner_product: 1.0e-11
  maximum_exp_energy_relative_error: 1.0e-10
  maximum_log_exp_relative_error: 1.0e-10
  maximum_helmholtz_roundtrip_relative_error: 1.0e-10
  maximum_translation_equivariance_error: 1.0e-10
  maximum_full_one_step_ratio: 1.0
  maximum_full_rollout_mean_ratio: 1.05
  maximum_full_rollout_worst_ratio: 1.5
  maximum_full_energy_drift: 1.0e-10
  maximum_full_spurious_peak_increase: 1
  maximum_full_rejection_rate: 0.99
  maximum_full_vs_a22_mean_degradation: 1.02
  maximum_exp_vs_radial_peakon_degradation: 1.05
  minimum_exp_peakon_gain_groups: 1
  exp_peakon_strict_gain_ratio: 0.995
