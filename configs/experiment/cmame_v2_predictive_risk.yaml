phase: CMAME-V2-stage-0-to-2
output_dir: results/cmame_v2_predictive_risk
next_phase_on_pass: CMAME-V2-stage-3-risk-operator-training

# This protocol is frozen before V2 labels are constructed. External KdV, ILW
# and power-law trajectories are deliberately absent from every split below.
domain: {length: 6.283185307179586}
families:
  modified_camassa_holm: [smooth_control, pure_particle_control, mixed_separated, mixed_clustered]
  benjamin_ono: [smooth_periodic, single_lorentzian, two_lorentzian, smooth_to_oscillatory]
splits:
  train: {groups_per_family: 24, seed: 201000000}
  validation: {groups_per_family: 6, seed: 202000000}
  calibration: {groups_per_family: 8, seed: 203000000}
  selection: {groups_per_family: 8, seed: 204000000}
source_rollout:
  maximum_replacement_attempts: 32
  replacement_policy: replace_whole_group_after_nonconvergent_candidate_v1

development:
  groups_per_family_cap: 1
  prefixes: 3
  points: 32
  dt: 0.0005
  tolerance: 0.002
  reference_refinement: 2
full:
  prefixes: 8
  points: 64
  dt: 0.0005
  tolerance: 0.001
  reference_refinement: 4

protocol:
  horizon_steps: 2
  continuation: zero_order_hold_post_action_discretization
  history_rho: 0.7
  local_budget_schedule: uniform_horizon_allocation_v1
  local_budget_floor: 1.0e-12
  reserve_fraction: 0.10
  cooldown_fraction: 0.0
  # These are frozen for the subsequent controller; stages 0--2 only log
  # cooldown=0 because no online V2 controller is yet active.
  hold_risk_threshold: 0.65
  coarse_risk_threshold: 0.15
  cooldown_prefixes: 4
  stable_prefixes_for_coarsening: 5

metric:
  version: future_horizon_relative_h1_risk_v1
  minimum_reference_h1_norm: 1.0e-12
  identity_tolerance: 1.0e-12
nonlinear_solver: {tolerance: 1.0e-11, maximum_iterations: 80, damping: 1.0}
reference: {rtol: 1.0e-10, atol: 1.0e-12, collision_tolerance: 1.0e-8}

acceptance:
  minimum_future_steps_per_row: 2
  minimum_source_group_count: 16
  maximum_history_causality_defect: 0.0

scope: >-
  Stages 0--2 of the V2 predictive-risk operator. The dataset uses only mCH
  and BO source trajectories. At each prefix and candidate action, labels are
  generated by a two-step zero-order-hold rollout at the post-action spatial
  and temporal discretization. A source group with a nonconvergent candidate
  rollout is discarded as a whole, logged, and replaced from the pre-reserved
  seed range. Reference solutions are labels only and never enter base,
  history or control features.
