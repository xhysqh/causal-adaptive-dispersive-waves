phase: CMAME-KDV-U1
output_dir: results/cmame_kdv_u1_zero_shot
mechanism_output_dir: results/cmame_u1_universal_mechanism
mechanism: {kind: universal}
next_phase_on_support: CMAME-U2_unified_closed_loop_benchmark

domain: {length: 20.0, x_min: -10.0}
seeds:
  # Blind KdV range, disjoint from U1 mCH--BO and the earlier KdV-Z0 audit.
  external_base: 111000000

development:
  groups_per_family: 1
  decisions: 3
  points: 32
  maximum_points: 64
  reference_points: 64
  macro_dt: 0.002
  tolerances: [0.05]
  tail_fraction: 0.65
  richardson_safety: 1.25
  spatial_safety: 0.05
  representation_safety: 0.02
  maximum_nonlinear_phase: 2.0
  maximum_invariant_drift: 0.02
  acceptance:
    minimum_tolerance_coverage: 0.75
    minimum_family_coverage: 0.0
    maximum_invariant_drift: 0.02
    minimum_authority_fraction: 0.0

full:
  groups_per_family: 5
  decisions: 64
  points: 64
  maximum_points: 256
  reference_points: 512
  macro_dt: 0.01
  tolerances: [0.01, 0.003]
  tail_fraction: 0.65
  richardson_safety: 1.25
  spatial_safety: 0.05
  representation_safety: 0.02
  maximum_nonlinear_phase: 2.0
  maximum_invariant_drift: 0.001

calibration:
  # Pre-registered before any blind KdV trajectory is generated.
  reserve_fraction: 0.10

reference: {rtol: 1.0e-10, atol: 1.0e-12}

acceptance:
  minimum_tolerance_coverage: 0.95
  minimum_family_coverage: 0.90
  maximum_invariant_drift: 0.001
  minimum_authority_fraction: 0.10
  minimum_action_intervention_fraction: 0.05
  maximum_median_error_ratio_to_control: 1.05
  maximum_median_work_ratio_to_control: 1.10

scope: >-
  Blind KdV transfer audit of the frozen equation-neutral U1 mechanism. U1 is
  trained and calibrated only on fresh mCH and Benjamin--Ono trajectories. KdV
  has no identifier, adapter, checkpoint, calibration row or threshold update.
  References are constructed only after all online decisions are committed.
