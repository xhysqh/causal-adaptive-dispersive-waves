name: code checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[ml,test]"
      - name: Verify source-only release
        run: python scripts/verify_release.py
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Numerical, controller, and publication tests
        run: python -m pytest -q
