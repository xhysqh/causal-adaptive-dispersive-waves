[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-adaptive-dispersive-waves"
version = "1.0.0"
description = "Physics-informed finite-horizon adaptive discretization for nonlinear dispersive waves"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "pandas>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
ml = ["torch>=2.0"]
test = ["pytest>=7.4"]
all = ["torch>=2.0", "pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"

